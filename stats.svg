<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-label="20+ projects built, 4 AI agents and bots, 8 event and community apps, 5 business and retail apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="130" rx="18" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="1">
    <line x1="225" y1="28" x2="225" y2="102"/>
    <line x1="450" y1="28" x2="450" y2="102"/>
    <line x1="675" y1="28" x2="675" y2="102"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="112" y="72" font-size="42" font-weight="700" fill="url(#num)">20+</text>
    <text x="112" y="100" font-size="15" fill="#c7d2fe">Projects built</text>

    <text x="337" y="72" font-size="42" font-weight="700" fill="url(#num)">4</text>
    <text x="337" y="100" font-size="15" fill="#c7d2fe">AI agents &amp; bots</text>

    <text x="562" y="72" font-size="42" font-weight="700" fill="url(#num)">8</text>
    <text x="562" y="100" font-size="15" fill="#c7d2fe">Event &amp; community apps</text>

    <text x="787" y="72" font-size="42" font-weight="700" fill="url(#num)">5</text>
    <text x="787" y="100" font-size="15" fill="#c7d2fe">Business &amp; retail apps</text>
  </g>
</svg>
