<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Paresh — AI agents and cloud apps for small businesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>

  <!-- agent icon -->
  <g transform="translate(150 110)">
    <circle r="95" fill="url(#glow)"/>
    <!-- orbit -->
    <circle r="62" fill="none" stroke="#6366f1" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <!-- links to tools -->
    <g stroke="url(#core)" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-62"/>
      <line x1="0" y1="0" x2="54" y2="31"/>
      <line x1="0" y1="0" x2="-54" y2="31"/>
      <line x1="0" y1="0" x2="54" y2="-31"/>
      <line x1="0" y1="0" x2="-54" y2="-31"/>
      <line x1="0" y1="0" x2="0" y2="62"/>
    </g>
    <!-- tool nodes -->
    <g fill="#0f172a" stroke="#22d3ee" stroke-width="2.5">
      <circle cx="0" cy="-62" r="9"/>
      <circle cx="54" cy="-31" r="9"/>
      <circle cx="54" cy="31" r="9"/>
      <circle cx="0" cy="62" r="9"/>
      <circle cx="-54" cy="31" r="9"/>
      <circle cx="-54" cy="-31" r="9"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="0" cy="-62" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="54" cy="-31" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="54" cy="31" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="62" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="-54" cy="31" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="-54" cy="-31" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- agent core: rounded head with eyes -->
    <rect x="-30" y="-26" width="60" height="52" rx="16" fill="url(#core)"/>
    <rect x="-22" y="-16" width="44" height="26" rx="10" fill="#0f172a"/>
    <circle cx="-9" cy="-3" r="4.5" fill="#22d3ee"><animate attributeName="r" values="4.5;4.5;0.8;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="9" cy="-3" r="4.5" fill="#22d3ee"><animate attributeName="r" values="4.5;4.5;0.8;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/></circle>
    <line x1="0" y1="-26" x2="0" y2="-36" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-39" r="4" fill="#22d3ee"/>
  </g>

  <!-- text -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="290" y="92" fill="#f8fafc" font-size="44" font-weight="700">Paresh</text>
    <text x="290" y="130" fill="#c7d2fe" font-size="21">AI agents &amp; cloud apps for small businesses</text>
    <text x="290" y="166" fill="#94a3b8" font-size="16">Storelyft LLC  ·  Northern Virginia</text>
  </g>
</svg>
